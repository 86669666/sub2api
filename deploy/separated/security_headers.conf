# Static panel responses only. Do not include this from proxied locations:
# nginx would append these headers on top of the backend's own CSP.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' @@GATEWAY@@ @@PANEL_WS@@; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
