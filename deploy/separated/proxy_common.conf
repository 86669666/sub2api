# Included from a location block. Docker's embedded DNS is 127.0.0.11.
# A variable proxy_pass is re-resolved and keeps the original request URI.
resolver 127.0.0.11 ipv6=off valid=30s;
set $sub2api_backend backend:8080;
proxy_pass http://$sub2api_backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
proxy_buffering off;
