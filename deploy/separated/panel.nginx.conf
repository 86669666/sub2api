# Same-origin panel. Browser talks only to this host.
# /api/v1 is proxied to the backend. /v1 is not: the gateway lives on the API host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Static responses do not get the backend SecurityHeaders middleware.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /v1 {
        default_type text/plain;
        return 404 "gateway is not served on the panel host\n";
    }

    location /v1/ {
        default_type text/plain;
        return 404 "gateway is not served on the panel host\n";
    }

    location /api/v1/admin/ {
        include /etc/nginx/admin-allowlist.conf;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/v1/ {
        include /etc/nginx/proxy_common.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
