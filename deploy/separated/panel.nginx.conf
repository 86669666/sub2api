# Panel APIs remain same-origin; API-key browser traffic uses the configured gateway.
# /api/v1 is proxied to the backend. /v1 is not: the gateway lives on the API host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/uri_guard.conf;
map $request_method $d0_status_allow { default GET; ~^GET$ ""; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    if ($d0_ambiguous_uri) { return 400; }

    location = /setup/status {
        if ($request_method != GET) { return 405; }
        include /etc/nginx/proxy_common.conf;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
        add_header Allow $d0_status_allow always;
    }
    location = /setup {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "setup wizard is disabled\n";
    }
    location ^~ /setup/ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 404 "setup wizard is disabled\n";
    }

    # Security headers live in static locations. A location that sets its own
    # add_header drops server-level add_header, and server-level headers would
    # also be appended onto proxied API responses.

    location = /v1 {
        include /etc/nginx/security_headers.conf;
        default_type text/plain;
        return 404 "gateway is not served on the panel host\n";
    }

    location /v1/ {
        include /etc/nginx/security_headers.conf;
        default_type text/plain;
        return 404 "gateway is not served on the panel host\n";
    }

    location /api/v1/admin/ {
        include /etc/nginx/admin-allowlist.conf;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/v1/ {
        include /etc/nginx/proxy_common.conf;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/security_headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
