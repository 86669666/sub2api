# Generated at build time from a validated, fixed origin pair.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
include /etc/nginx/uri_guard.conf;
map $request_uri $d0_family {
    default 0;
    "~^/v1/usage(\\?|$)" 1;
    "~^/v1/images/batches(/[^?]*)?(\\?|$)" 1;
}
map $http_origin $d0_origin {
    default bad;
    "" absent;
    "~^@@ORIGIN_REGEX@@$" good;
}
map $request_method $d0_method {
    default bad;
    ~^(GET|POST|DELETE)$ actual;
    ~^OPTIONS$ preflight;
}
map $http_access_control_request_method $d0_preflight_method {
    default 0;
    ~^(GET|POST|DELETE)$ 1;
}
map $http_access_control_request_headers $d0_preflight_headers {
    default 0;
    "" 1;
    "~*^[ \\t]*(authorization|content-type|idempotency-key)([ \\t]*,[ \\t]*(authorization|content-type|idempotency-key))*[ \\t]*$" 1;
}
map "$d0_origin:$d0_family:$d0_ambiguous_uri:$d0_method:$d0_preflight_method:$d0_preflight_headers" $d0_decision {
    default deny;
    ~^absent:[01]:0:(actual|bad):[01]:[01]$ sdk;
    ~^good:1:0:actual:[01]:[01]$ actual;
    ~^good:1:0:bad:[01]:[01]$ method;
    ~^good:1:0:preflight:1:1$ preflight;
}
# Actual error responses have permission independent of preflight-only fields.
map $d0_decision $d0_allow_origin {
    default "";
    ~^(actual|method|preflight)$ "@@PANEL@@";
}
map $d0_allow_origin $d0_allow_methods { default "GET, POST, DELETE, OPTIONS"; "" ""; }
map $d0_allow_origin $d0_allow_headers { default "Authorization, Content-Type, Idempotency-Key"; "" ""; }
map $d0_allow_origin $d0_expose { default "X-Request-Id"; "" ""; }
map $d0_decision $d0_max_age { default ""; ~^preflight$ 600; }
map $d0_decision $d0_allow { default ""; ~^method$ "GET, POST, DELETE, OPTIONS"; }

server {
    listen 80;
    server_name _;
    # Never leak backend CORS policy through ANY proxied location.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;

    location /v1/ {
        add_header Access-Control-Allow-Origin $d0_allow_origin always;
        add_header Access-Control-Allow-Methods $d0_allow_methods always;
        add_header Access-Control-Allow-Headers $d0_allow_headers always;
        add_header Access-Control-Expose-Headers $d0_expose always;
        add_header Access-Control-Max-Age $d0_max_age always;
        add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers" always;
        add_header Allow $d0_allow always;
        if ($d0_decision = deny) { return 403; }
        if ($d0_decision = method) { return 405; }
        if ($d0_decision = preflight) { return 204; }
        include /etc/nginx/proxy_common.conf;
        proxy_cache off;
    }
    location = /health {
        if ($d0_ambiguous_uri) { return 400; }
        include /etc/nginx/proxy_common.conf;
    }
    location / { default_type text/plain; return 404 "not found\n"; }
}
