# API host. Only the OpenAI-compatible gateway and the health check are exposed.
# Management routes (/api/v1) stay on the panel host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location /v1/ {
        include /etc/nginx/proxy_common.conf;
        # proxy_common.conf already disables buffering and sets the read timeout.
        proxy_cache off;
    }

    location = /health {
        include /etc/nginx/proxy_common.conf;
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
