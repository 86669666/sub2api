# Panel /api/v1/admin/ source filter.
#
# This laboratory file allows every client so an operator on any machine can
# log in and call the admin API. Replace it before a public deployment:
#
#   allow 203.0.113.0/24;   # office / VPN
#   deny all;
#
# Admin API keys are accepted on this same prefix, so the allowlist is the
# network control in front of that single all-powerful key.
allow all;
